providers = ["node"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = [
  "npm run db:generate",
  "npm run build",
  "npx playwright install chromium --with-deps"
]

[start]
cmd = "sh start.sh"

[variables]
NODE_ENV = "production"
PORT = "3000"
PLAYWRIGHT_BROWSERS_PATH = "/app/.cache/ms-playwright"
