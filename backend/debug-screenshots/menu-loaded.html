    function fnAlertaSIF(mensaje, tipo, funcion, tamanio, templateText) {
        if (usuarioEstaUtilizandoMovil()) { $("#alertaGenericoSIF").dxPopup("instance").option("width", Math.floor(window.innerWidth * 0.9)); }
        $("#alertaGenericoSIF").dxPopup("instance").show();
        $("#alertaGenericoSIFTextoTemplate").html(' <label class="etiquetaCompact" style="margin-top: 5px;" id="alertaGenericoSIFLabel"></label>');
        if (ConInformacion(tamanio)) {
            if (tamanio.hasOwnProperty("ancho")) $("#alertaGenericoSIF").dxPopup("instance").option("width", tamanio.ancho);
            if (tamanio.hasOwnProperty("alto")) $("#alertaGenericoSIF").dxPopup("instance").option("height", tamanio.alto);
        }
        $("#alertaGenericoSIF .dx-popup-title").css("background-color", localStorage.getItem("ColorHeaderPopUp"));
        var estatusMensaje = urlIconMessageInformation;
        switch (tipo) {
            case "asterisk": estatusMensaje = urlIconMessageAsterisk; break;
            case "error": estatusMensaje = urlIconMessageError; break;
            case "exclamation": estatusMensaje = urlIconMessageExclamation; break;
            case "hand": estatusMensaje = urlIconMessageHand; break;
            case "information": estatusMensaje = urlIconMessageInformation; break;
            case "question": estatusMensaje = urlIconMessageQuestion; break;
            case "stop": estatusMensaje = urlIconMessageStop; break;
            case "warning": estatusMensaje = urlIconMessageWarning; break;
        }
        $("#alertaGenericoSIFImagen").attr("src", estatusMensaje);
        if (ConInformacion(templateText)) {
            $("#alertaGenericoSIFTextoTemplate").html(templateText);
        }
        else {
            $("#alertaGenericoSIFLabel").text(mensaje);
        }

        $("#alertaGenericoSIFBotonOK").dxButton("instance").off("click");
        $("#alertaGenericoSIFBotonOK").dxButton("instance").on("click", function () {
            $("#alertaGenericoSIF").dxPopup("instance").option({ "width": "500px", "height": "250px" });
            $("#alertaGenericoSIF").dxPopup("instance").hide();
        });

        if (funcion != null || funcion != undefined) {
            $("#alertaGenericoSIFBotonOK").dxButton("instance").on("click", function (e) {
                return funcion(e);
            });
        }
    }

    function fnConfirmacionSIF(mensaje, tipo, funcionOk, funcionNo, tamanio, templateText) {
        if (usuarioEstaUtilizandoMovil()) {  $("#confirmacionGenericoSIF").dxPopup("instance").option("width", Math.floor(window.innerWidth * 0.9)); }
