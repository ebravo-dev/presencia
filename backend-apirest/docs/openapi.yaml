openapi: 3.0.3
info:
  title: Presencia Backend API REST UAT
  version: 0.1.0
  description: >
    API REST interna para autenticar contra el portal escolar UAT con cookies
    ASP.NET y consultar horarios/examenes de profesor.
servers:
  - url: http://localhost:3100
security: []
paths:
  /health:
    get:
      summary: Estado del servicio
      responses:
        "200":
          description: Servicio disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/uat/sessions:
    post:
      summary: Crea una sesion autenticada contra UAT
      description: >
        Ejecuta GET /Login, POST /Login/Accesar_Dominio y GET /Login/Validar
        manteniendo un CookieJar persistente en memoria.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Sesion UAT creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/sessions/{sessionId}:
    delete:
      summary: Elimina una sesion UAT en memoria
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "200":
          description: Resultado de eliminacion
          content:
            application/json:
              schema:
                type: object
                required: [deleted, sessionId]
                properties:
                  deleted:
                    type: boolean
                  sessionId:
                    type: string
                    format: uuid
  /api/uat/profesor/consultas/horarios:
    get:
      summary: Consulta horarios del profesor autenticado
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - $ref: "#/components/parameters/IdCicloEscolar"
        - $ref: "#/components/parameters/IdDes"
      responses:
        "200":
          description: JSON devuelto por BuscaHorarios, envuelto con metadatos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/profesor/consultas/examenes:
    get:
      summary: Consulta examenes del profesor autenticado
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - $ref: "#/components/parameters/IdCicloEscolar"
        - $ref: "#/components/parameters/IdDes"
      responses:
        "200":
          description: JSON devuelto por BuscaExamenes, envuelto con metadatos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/profesor/consultas/snapshot:
    post:
      summary: Login transitorio y consulta de horarios/examenes
      description: >
        Ejecuta todo el flujo en una sola peticion usando un CookieJar temporal.
        No guarda la sesion en memoria.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotRequest"
      responses:
        "200":
          description: Horarios y opcionalmente examenes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/catalogos/niveles-educativos:
    get:
      summary: Catalogo de niveles educativos para profesor
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      responses:
        "200":
          description: JSON devuelto por BuscarNivelEducativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
  /api/uat/catalogos/campus:
    get:
      summary: Catalogo de campus
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - name: id_nivel_educativo
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: JSON devuelto por BuscarCampus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
  /api/uat/catalogos/des:
    get:
      summary: Catalogo de DES
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - name: id_nivel_educativo
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: id_cu
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: JSON devuelto por BuscarDES
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
  /api/uat/catalogos/ciclos-escolares:
    get:
      summary: Catalogo de ciclos escolares
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      responses:
        "200":
          description: JSON devuelto por BuscarCicloEscolar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
components:
  parameters:
    UatSessionHeader:
      name: X-UAT-Session-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdCicloEscolar:
      name: Id_Ciclo_Escolar
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      example: 150
    IdDes:
      name: Id_DES
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      example: 12
  responses:
    Error:
      description: Error de validacion, autenticacion o portal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: profesor@uat.edu.mx
        password:
          type: string
          format: password
    HealthResponse:
      type: object
      required: [status, service, activeUatSessions, timestamp]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: backend-apirest
        activeUatSessions:
          type: integer
        timestamp:
          type: string
          format: date-time
    SessionResponse:
      type: object
      required: [sessionId, authenticated, login, createdAt, lastUsedAt, expiresAt]
      properties:
        sessionId:
          type: string
          format: uuid
        authenticated:
          type: boolean
        login:
          $ref: "#/components/schemas/SafeLogin"
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        activeSessions:
          type: integer
        cookieDiagnostics:
          type: object
          properties:
            cookieNames:
              type: array
              items:
                type: string
            hasSessionCookie:
              type: boolean
            hasAuthCookie:
              type: boolean
    SafeLogin:
      type: object
      properties:
        exito:
          type: boolean
        cambiaPass:
          type: boolean
        mensaje:
          type: string
        parametros:
          type: object
          additionalProperties: true
    UatDataResponse:
      type: object
      required: [source, endpoint, query, data, fetchedAt]
      properties:
        source:
          type: string
          example: UAT
        endpoint:
          type: string
          example: BuscaHorarios
        query:
          type: object
          additionalProperties: true
        data:
          description: JSON crudo recibido del portal UAT.
        fetchedAt:
          type: string
          format: date-time
    SnapshotRequest:
      allOf:
        - $ref: "#/components/schemas/Credentials"
        - type: object
          required: [Id_Ciclo_Escolar, Id_DES]
          properties:
            Id_Ciclo_Escolar:
              type: integer
              minimum: 1
              example: 150
            Id_DES:
              type: integer
              minimum: 1
              example: 12
            includeExamenes:
              type: boolean
              default: true
    SnapshotResponse:
      type: object
      required: [source, authenticated, login, query, horarios, fetchedAt]
      properties:
        source:
          type: string
          example: UAT
        authenticated:
          type: boolean
        login:
          $ref: "#/components/schemas/SafeLogin"
        query:
          type: object
          additionalProperties: true
        horarios:
          description: JSON crudo recibido de BuscaHorarios.
        examenes:
          description: JSON crudo recibido de BuscaExamenes cuando includeExamenes=true.
        fetchedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: UAT_LOGIN_FAILED
        message:
          type: string
        details:
          nullable: true
