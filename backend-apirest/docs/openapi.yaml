openapi: 3.0.3
info:
  title: Presencia Backend API REST UAT
  version: 1.4.0
  description: >
    API REST interna para autenticar contra el portal escolar UAT con cookies
    ASP.NET y consultar horarios/examenes de profesor.
servers:
  - url: http://localhost:3100
security: []
paths:
  /health:
    get:
      summary: Estado del servicio
      responses:
        "200":
          description: Servicio disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/uat/sessions:
    post:
      summary: Crea una sesion autenticada contra UAT
      description: >
        Ejecuta GET /Login, POST /Login/Accesar_Dominio y GET /Login/Validar
        manteniendo un CookieJar cifrado y compartido en Redis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Sesion UAT creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/sessions/{sessionId}:
    delete:
      summary: Revoca una sesion UAT almacenada en Redis
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "200":
          description: Resultado de eliminacion
          content:
            application/json:
              schema:
                type: object
                required: [deleted, sessionId]
                properties:
                  deleted:
                    type: boolean
                  sessionId:
                    type: string
                    format: uuid
  /api/uat/profesor/sync:
    post:
      summary: Encola una nueva cosecha academica con la sesion vigente
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      responses:
        "202":
          description: Evento durable aceptado
          content:
            application/json:
              schema:
                type: object
                required: [accepted, sessionId, message]
                properties:
                  accepted:
                    type: boolean
                    enum: [true]
                  sessionId:
                    type: string
                    format: uuid
                  message:
                    type: string
        "401":
          $ref: "#/components/responses/Error"
  /api/uat/profesor/consultas/horarios:
    get:
      summary: Consulta horarios del profesor autenticado
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - $ref: "#/components/parameters/IdCicloEscolar"
        - $ref: "#/components/parameters/IdDes"
      responses:
        "200":
          description: JSON devuelto por BuscaHorarios, envuelto con metadatos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/profesor/consultas/examenes:
    get:
      summary: Consulta examenes del profesor autenticado
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - $ref: "#/components/parameters/IdCicloEscolar"
        - $ref: "#/components/parameters/IdDes"
      responses:
        "200":
          description: JSON devuelto por BuscaExamenes, envuelto con metadatos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/profesor/consultas/snapshot:
    post:
      summary: Login transitorio y consulta de horarios/examenes
      description: >
        Ejecuta todo el flujo en una sola peticion usando un CookieJar temporal.
        No conserva la sesion después de responder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotRequest"
      responses:
        "200":
          description: Horarios y opcionalmente examenes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/catalogos/niveles-educativos:
    get:
      summary: Catalogo de niveles educativos para profesor
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      responses:
        "200":
          description: JSON devuelto por BuscarNivelEducativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
  /api/uat/catalogos/campus:
    get:
      summary: Catalogo de campus
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - name: id_nivel_educativo
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: JSON devuelto por BuscarCampus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
  /api/uat/catalogos/des:
    get:
      summary: Catalogo de DES
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - name: id_nivel_educativo
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: id_cu
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: JSON devuelto por BuscarDES
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
  /api/uat/catalogos/ciclos-escolares:
    get:
      summary: Catalogo de ciclos escolares
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      responses:
        "200":
          description: JSON devuelto por BuscarCicloEscolar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
  /api/uat/profesor/ciclo-escolar:
    get:
      summary: Obtiene el ciclo escolar activo configurado para la aplicación
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      responses:
        "200":
          description: Ciclo escolar activo y periodos disponibles
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [active]
                    properties:
                      active:
                        type: object
                        required: [externalId, year, term, name]
                        properties:
                          externalId: { type: integer }
                          year: { type: integer }
                          term: { type: integer, minimum: 1, maximum: 3 }
                          name: { type: string }
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/profesor/control-asistencia/grupos:
    get:
      summary: Consulta grupos del profesor para un ciclo y DES
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - $ref: "#/components/parameters/IdDesControl"
        - $ref: "#/components/parameters/IdCiclo"
        - $ref: "#/components/parameters/IdPlantilla"
      responses:
        "200":
          description: JSON devuelto por BuscaGruposProfesor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/profesor/control-asistencia/semanas:
    get:
      summary: Consulta semanas disponibles para un grupo
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - $ref: "#/components/parameters/IdGrupo"
      responses:
        "200":
          description: JSON devuelto por BuscaSemanas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/profesor/control-asistencia/asistencia-grupo:
    get:
      summary: Consulta alumnos y asistencia capturada para una semana de grupo
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - $ref: "#/components/parameters/IdGrupo"
        - name: fec_ini
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\d{2}/\\d{2}/\\d{4}$"
          example: 19/01/2026
        - name: fec_fin
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\d{2}/\\d{2}/\\d{4}$"
          example: 25/01/2026
      responses:
        "200":
          description: JSON devuelto por BuscaAsistenciaGrupo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatObjectResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/profesor/control-asistencia/asistencias:
    post:
      summary: Acepta una captura durable para publicar en UAT
      description: >
        Attendance Service valida y versiona la lista. Antes de responder, UAT
        Integration persiste un job idempotente con la credencial cifrada; la
        publicación al portal ocurre de forma asíncrona.
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarAsistenciasRequest"
      responses:
        "202":
          description: Captura aceptada y entrega UAT persistida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceCaptureResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/asistencia/guardar:
    post:
      summary: Alias corto para aceptar una captura durable
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarAsistenciasRequest"
      responses:
        "202":
          description: Captura aceptada y entrega UAT persistida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceCaptureResponse"
  /api/uat/alumnos/sessions:
    post:
      summary: Crea una sesion autenticada contra el portal de alumnos SUR
      description: >
        Obtiene __RequestVerificationToken, ejecuta Login/Accesar_Dominio,
        valida la sesion, consulta carreras y selecciona el plan solicitado o
        el primero disponible. Registra o valida obligatoriamente el UUID y el
        dispositivo del alumno en Attendance Service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentCredentials"
      responses:
        "201":
          description: Sesion de alumno creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentSessionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/alumnos/sessions/{sessionId}:
    delete:
      summary: Revoca una sesion de alumno almacenada en Redis
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "200":
          description: Resultado de eliminacion
  /api/uat/alumnos/carreras:
    get:
      summary: Consulta carreras del alumno autenticado
      parameters:
        - $ref: "#/components/parameters/UatStudentSessionHeader"
      responses:
        "200":
          description: JSON devuelto por CarrerasAlumno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
  /api/uat/alumnos/carreras/seleccionar:
    post:
      summary: Selecciona carrera/plan del alumno autenticado
      parameters:
        - $ref: "#/components/parameters/UatStudentSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idPlanEstudio]
              properties:
                idPlanEstudio:
                  type: integer
                  minimum: 1
                  example: 3313
      responses:
        "200":
          description: JSON devuelto por SeleccionarCarreraAlumno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatObjectResponse"
  /api/uat/alumnos/horario:
    get:
      summary: Consulta horario del alumno autenticado
      parameters:
        - $ref: "#/components/parameters/UatStudentSessionHeader"
      responses:
        "200":
          description: JSON devuelto por SpuSelHorarioFichaAlumno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
  /api/uat/alumnos/calificaciones/parciales:
    get:
      summary: Consulta calificaciones parciales del alumno autenticado
      parameters:
        - $ref: "#/components/parameters/UatStudentSessionHeader"
      responses:
        "200":
          description: JSON devuelto por SPUSELCalificacionesParciales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
  /api/uat/alumnos/calificaciones/finales:
    get:
      summary: Consulta calificaciones finales del alumno autenticado
      parameters:
        - $ref: "#/components/parameters/UatStudentSessionHeader"
      responses:
        "200":
          description: JSON devuelto por ConsultaEvaluaciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
  /api/uat/asistencia/registros/estado:
    post:
      summary: Reconcilia registros locales después de cerrar o reiniciar la app
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientRecordIds]
              properties:
                clientRecordIds:
                  type: array
                  maxItems: 200
                  items: { type: string }
      responses:
        "200": { description: Último estado conocido por registro local }
  /api/coordinacion/resumen:
    get:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Resumen del grafo academico recolectado
      responses:
        "200":
          description: Conteos y coordinaciones acumulados localmente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoordinationOverviewResponse"
  /api/coordinacion/infraestructura/resumen:
    get:
      tags: [Coordinacion]
      summary: Resumen operativo de beacons, vinculaciones y sustituciones
      responses:
        "200":
          description: Conteos y actividad reciente del backend de asistencia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfrastructureSummaryResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/coordinacion/coordinaciones:
    get:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Lista coordinaciones academicas
      responses:
        "200":
          description: Coordinaciones con conteos de relaciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoordinationListResponse"
  /api/coordinacion/profesores:
    get:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Lista profesores recolectados
      parameters:
        - name: coordinationId
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Pagina de profesores normalizados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherListResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/coordinacion/profesores/{teacherId}/asignaciones:
    get:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Detalle y asignaciones de un profesor
      parameters:
        - name: teacherId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Profesor con materias, grupos, ciclos y coordinaciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherAssignmentsResponse"
        "404":
          $ref: "#/components/responses/Error"
  /api/coordinacion/auth/login:
    post:
      tags: [Coordinacion]
      summary: Inicia una sesión administrativa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
      responses:
        "200":
          description: Sesión creada; emite cookie HttpOnly coord_session
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/coordinacion/auth/me:
    get:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Obtiene el coordinador autenticado
      responses:
        "200": { description: Perfil de coordinación }
        "401": { $ref: "#/components/responses/Error" }
  /api/coordinacion/auth/logout:
    post:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Revoca la sesión administrativa
      responses:
        "204": { description: Sesión revocada }
  /api/coordinacion/reportes/asistencia-semanal:
    get:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Reporte de cumplimiento docente de lunes a sabado
      parameters:
        - name: teacherId
          in: query
          required: true
          schema: { type: string }
        - name: weekStart
          in: query
          required: true
          description: Fecha del lunes en formato YYYY-MM-DD
          schema: { type: string, format: date }
      responses:
        "200":
          description: Matriz semanal con estados TAKEN, MISSING, FUTURE, NOT_SCHEDULED o UNKNOWN_SCHEDULE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeeklyAttendanceReport" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/coordinacion/reportes/asistencia-rango:
    get:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Reporte agregado por materia para un rango de fechas
      parameters:
        - name: teacherId
          in: query
          required: true
          schema: { type: string }
        - name: startDate
          in: query
          required: true
          description: Fecha inicial en formato YYYY-MM-DD
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: true
          description: Fecha final en formato YYYY-MM-DD
          schema: { type: string, format: date }
      responses:
        "200":
          description: Resumen por materia con dias programados, reportados y porcentaje
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RangeAttendanceReport" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/uat/profesor/clases-compartidas:
    get:
      summary: Lista las clases no oficiales vigentes del profesor autenticado
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - name: year
          in: query
          required: false
          description: Anio del ciclo escolar compartido. Debe enviarse junto con term.
          schema: { type: integer, minimum: 2000, maximum: 2100, example: 2026 }
        - name: term
          in: query
          required: false
          description: Parte del anio escolar. 1=Primavera, 2=Verano, 3=Otono.
          schema: { type: integer, minimum: 1, maximum: 3, example: 1 }
      responses:
        "200":
          description: Clases compartidas listas para integrarse con la carga oficial
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfessorSharedClassesResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/uat/profesor/device-bindings/resolve:
    post:
      summary: Resuelve UUID de alumnos pertenecientes al roster del profesor
      description: >
        Valida la sesion UAT del profesor y delega la consulta al propietario
        Attendance Service. Incluye grupos propios o clases compartidas activas;
        las matriculas fuera de ese alcance nunca se incluyen en la respuesta.
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfessorDeviceBindingResolveRequest" }
      responses:
        "200":
          description: Vinculaciones activas autorizadas por el roster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfessorDeviceBindingResolveResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/uat/profesor/device-bindings:
    post:
      summary: Da de alta el UUID de un alumno del grupo autenticado
      description: >
        Attendance valida de forma transaccional que el profesor sea titular o
        sustituto autorizado del grupo y que la matrícula pertenezca a su padrón
        activo. Un profesor no puede reemplazar un UUID que ya esté activo.
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfessorDeviceBindingCreateRequest" }
      responses:
        "200": { description: Vínculo creado o solicitud idempotente }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/uat/profesor/beacons/resolve:
    post:
      summary: Resuelve beacons de salones pertenecientes al profesor
      description: >
        Valida la sesion UAT y delega la configuración a Attendance Service.
        Attendance consume de Academic los permisos de clases compartidas y los
        revoca por evento. Una solicitud no puede ampliar permisos enviando salones
        arbitrarios.
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfessorBeaconResolveRequest" }
      responses:
        "200":
          description: Beacons autorizados y salones autorizados sin configuracion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfessorBeaconResolveResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/uat/profesor/presencia/entrada:
    post:
      summary: Registra la entrada del profesor detectada por beacon
      description: >
        Attendance Service valida que el profesor autenticado sea titular o tenga
        una clase compartida activa y que el UUID sea el configurado para el salón.
        La fecha y hora efectivas siempre provienen del servidor; clientDetectedAt
        sólo es telemetría diagnóstica.
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfessorPresenceEntryRequest" }
      responses:
        "200": { description: Reintento idempotente, content: { application/json: { schema: { $ref: "#/components/schemas/ProfessorPresenceResponse" } } } }
        "201": { description: Entrada registrada, content: { application/json: { schema: { $ref: "#/components/schemas/ProfessorPresenceResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/uat/profesor/presencia/salida:
    post:
      summary: Registra la salida del profesor
      description: La hora efectiva se deriva del reloj del servidor y el grupo se valida contra el roster propio o una clase compartida activa.
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfessorPresenceExitRequest" }
      responses:
        "200": { description: Reintento idempotente, content: { application/json: { schema: { $ref: "#/components/schemas/ProfessorPresenceResponse" } } } }
        "201": { description: Salida registrada, content: { application/json: { schema: { $ref: "#/components/schemas/ProfessorPresenceResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/uat/profesor/presencia/alumnos:
    post:
      summary: Procesa detecciones BLE de alumnos vinculados
      description: >
        Cruza UUIDs contra vinculaciones activas y el roster autorizado. Cada alumno
        se deduplica por sesión y matrícula. El resultado permanece DRAFT y no genera
        una solicitud de subida a UAT hasta que el profesor finaliza la captura.
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentPresenceRequest" }
      responses:
        "200": { description: Reintento idempotente, content: { application/json: { schema: { $ref: "#/components/schemas/StudentPresenceResponse" } } } }
        "201": { description: Detecciones procesadas, content: { application/json: { schema: { $ref: "#/components/schemas/StudentPresenceResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/coordinacion/clases-compartidas/opciones:
    get:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Lista profesores y clases oficiales disponibles para compartir
      responses:
        "200": { description: Opciones de asignacion }
  /api/coordinacion/clases-compartidas:
    get:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Lista las asignaciones de clases compartidas
      responses:
        "200":
          description: Asignaciones registradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SharedClassAssignment" }
    post:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Comparte una clase oficial con otro profesor
      description: Academic Service conserva la asignación, auditoría y evento de autorización; Attendance aplica el permiso de forma idempotente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedClassInput" }
      responses:
        "201": { description: Clase compartida }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/coordinacion/clases-compartidas/{id}:
    put:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Actualiza vigencia, profesor receptor o estado
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedClassUpdate" }
      responses:
        "200": { description: Asignacion actualizada }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Elimina una asignacion compartida
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Asignacion eliminada }
        "404": { $ref: "#/components/responses/Error" }
  /api/superUsuario/alumnos-vinculados:
    get:
      tags: [SuperUsuario]
      security: [{ SuperUserCookie: [] }]
      summary: Lista los UUID de asistencia vinculados a matrículas
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 40 }
      responses:
        "200": { description: Vínculos activos con sus alumnos y grupos sincronizados }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [SuperUsuario]
      security: [{ SuperUserCookie: [] }]
      summary: Vincula manualmente un beacon iOS a la matrícula de un alumno
      description: El UUID queda activo en Attendance Service y puede resolver la detección automática contra el padrón por matrícula. Si la matrícula ya tiene un vínculo, se reemplaza de forma auditada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matricula, attendanceUuid]
              additionalProperties: false
              properties:
                matricula: { type: string, minLength: 1, maxLength: 40 }
                attendanceUuid: { type: string, format: uuid }
      responses:
        "201": { description: Alumno vinculado o actualizado }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/superUsuario/alumnos-vinculados/{matricula}:
    delete:
      tags: [SuperUsuario]
      security: [{ SuperUserCookie: [] }]
      summary: Desactiva el UUID vinculado a una matrícula
      parameters:
        - name: matricula
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
      responses:
        "204": { description: Vínculo desactivado }
        "401": { $ref: "#/components/responses/Error" }
  /api/superUsuario/bases-datos:
    get:
      tags: [SuperUsuario]
      security: [{ SuperUserCookie: [] }]
      summary: Lista las bases cuyos registros puede borrar el super usuario
      responses:
        "200":
          description: Catálogo con frases de confirmación e impacto de sesión
        "401": { $ref: "#/components/responses/Error" }
  /api/superUsuario/bases-datos/borrar:
    post:
      tags: [SuperUsuario]
      security: [{ SuperUserCookie: [] }]
      summary: Borra registros de una base específica o de todas
      description: Conserva esquemas, tablas y migraciones. La frase debe coincidir exactamente con la indicada por el catálogo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, confirmation]
              additionalProperties: false
              properties:
                target:
                  type: string
                  enum: [integration, identity, academic, attendance, coordination-query, all]
                confirmation: { type: string }
      responses:
        "200": { description: Borrado completado }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    CoordinatorCookie:
      type: apiKey
      in: cookie
      name: coord_session
    SuperUserCookie:
      type: apiKey
      in: cookie
      name: super_user_session
  parameters:
    UatSessionHeader:
      name: X-UAT-Session-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    UatStudentSessionHeader:
      name: X-UAT-Student-Session-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdCicloEscolar:
      name: Id_Ciclo_Escolar
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      example: 150
    IdDes:
      name: Id_DES
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      example: 12
    IdDesControl:
      name: Id_Des
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      example: 12
    IdCiclo:
      name: Id_Ciclo
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      example: 150
    IdPlantilla:
      name: Id_Plantilla
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      example: 308127
    IdGrupo:
      name: Id_Grupo
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      example: 947699
  responses:
    Error:
      description: Error de validacion, autenticacion o portal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: profesor@uat.edu.mx
        password:
          type: string
          format: password
    StudentCredentials:
      allOf:
        - $ref: "#/components/schemas/Credentials"
        - type: object
          required: [attendanceUuid, deviceBindingId, platform]
          properties:
            idPlanEstudio:
              type: integer
              minimum: 1
              example: 3313
            attendanceUuid:
              type: string
              format: uuid
              description: UUID BLE estable generado por la app de alumnos.
            deviceBindingId:
              type: string
              format: uuid
              description: Identificador estable de la instalacion/dispositivo.
            platform:
              type: string
              enum: [android, ios]
              example: android
            deviceInfo:
              type: string
    HealthResponse:
      type: object
      required: [status, service, activeUatSessions, activeUatStudentSessions, timestamp]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: backend-apirest
        activeUatSessions:
          type: integer
        activeUatStudentSessions:
          type: integer
        timestamp:
          type: string
          format: date-time
    SessionResponse:
      type: object
      required: [sessionId, authenticated, login, createdAt, lastUsedAt, expiresAt, demoMode]
      properties:
        sessionId:
          type: string
          format: uuid
        authenticated:
          type: boolean
        demoMode:
          type: boolean
          description: Indica que la sesión usa exclusivamente el portal ficticio aislado.
        demoCapabilities:
          type: object
          properties:
            simulateRoomBeacon:
              type: boolean
        login:
          $ref: "#/components/schemas/SafeLogin"
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        activeSessions:
          type: integer
        cookieDiagnostics:
          type: object
          properties:
            cookieNames:
              type: array
              items:
                type: string
            hasSessionCookie:
              type: boolean
            hasAuthCookie:
              type: boolean
        identitySession:
          $ref: "#/components/schemas/IdentitySessionGrant"
    StudentSessionResponse:
      allOf:
        - $ref: "#/components/schemas/SessionResponse"
        - type: object
          required: [careers, selectedCareer, deviceBindingToken, identitySession]
          properties:
            careers:
              type: array
              items:
                type: object
                additionalProperties: true
            selectedCareer:
              type: object
              additionalProperties: true
            deviceBindingToken:
              type: string
              description: Token acotado para renovar exclusivamente el vínculo exacto del celular.
            identitySession:
              $ref: "#/components/schemas/IdentitySessionGrant"
    IdentitySessionGrant:
      type: object
      required: [identityId, sessionId, accessToken, expiresAt]
      properties:
        identityId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
    ProfessorDeviceBindingResolveRequest:
      type: object
      required: [matriculas]
      properties:
        matriculas:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 40 }
    ProfessorDeviceBindingResolveResponse:
      type: object
      required: [data, missing]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/StudentDeviceBinding" }
        missing:
          type: array
          items: { type: string }
    ProfessorDeviceBindingCreateRequest:
      type: object
      required: [externalGroupId, matricula, attendanceUuid]
      additionalProperties: false
      properties:
        externalGroupId: { type: string, minLength: 1, maxLength: 160 }
        matricula: { type: string, minLength: 1, maxLength: 40 }
        attendanceUuid: { type: string, format: uuid }
    ProfessorBeaconResolveRequest:
      type: object
      required: [classrooms]
      properties:
        classrooms:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 160 }
    ProfessorBeaconResolveResponse:
      type: object
      required: [data, missing]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ClassroomBeacon" }
        missing:
          type: array
          items: { type: string }
    ClassroomBeacon:
      type: object
      required: [id, uuid, classroom, classroomKey, createdAt, updatedAt]
      properties:
        id: { type: string }
        uuid: { type: string, format: uuid }
        classroom: { type: string }
        classroomKey: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProfessorPresenceEntryRequest:
      type: object
      required: [externalGroupId, beaconUuid]
      properties:
        externalGroupId: { type: string, minLength: 1, maxLength: 160 }
        beaconUuid: { type: string, format: uuid }
        clientDetectedAt: { type: string, format: date-time, nullable: true }
        rssi: { type: integer, minimum: -160, maximum: 20, nullable: true }
        distance: { type: number, minimum: 0, maximum: 10000, nullable: true }
        bluetoothAddress: { type: string, maxLength: 80, nullable: true }
    ProfessorPresenceExitRequest:
      type: object
      required: [externalGroupId]
      properties:
        externalGroupId: { type: string, minLength: 1, maxLength: 160 }
        clientDetectedAt: { type: string, format: date-time, nullable: true }
    StudentPresenceDetection:
      type: object
      required: [beaconUuid]
      properties:
        beaconUuid: { type: string, format: uuid }
        detectedAt: { type: string, format: date-time, nullable: true }
        rssi: { type: integer, minimum: -160, maximum: 20, nullable: true }
        distance: { type: number, minimum: 0, maximum: 10000, nullable: true }
        txPower: { type: integer, minimum: -160, maximum: 20, nullable: true }
        bluetoothAddress: { type: string, maxLength: 80, nullable: true }
        major: { type: integer, minimum: 0, maximum: 65535, nullable: true }
        minor: { type: integer, minimum: 0, maximum: 65535, nullable: true }
    StudentPresenceRequest:
      type: object
      required: [externalGroupId, detections]
      properties:
        externalGroupId: { type: string, minLength: 1, maxLength: 160 }
        detections:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/StudentPresenceDetection" }
    ProfessorPresenceResponse:
      type: object
      required: [data, message]
      properties:
        data:
          type: object
          required: [attendanceSessionId, externalGroupId, date, professorEntryAt, professorExitAt, duplicate, version]
          properties:
            attendanceSessionId: { type: string }
            externalGroupId: { type: string }
            date: { type: string, format: date }
            professorEntryAt: { type: string, format: date-time, nullable: true }
            professorExitAt: { type: string, format: date-time, nullable: true }
            duplicate: { type: boolean }
            version: { type: integer, minimum: 1 }
        message: { type: string }
    StudentPresenceResponse:
      type: object
      required: [data, message]
      properties:
        data:
          type: object
          required: [attendanceSessionId, externalGroupId, date, matchedCount, matched, duplicate, version]
          properties:
            attendanceSessionId: { type: string, nullable: true }
            externalGroupId: { type: string }
            date: { type: string, format: date }
            matchedCount: { type: integer, minimum: 0 }
            matched:
              type: array
              items:
                type: object
                required: [studentId, matricula, beaconUuid, detectedAt]
                properties:
                  studentId: { type: string }
                  matricula: { type: string }
                  beaconUuid: { type: string, format: uuid }
                  detectedAt: { type: string, format: date-time }
            duplicate: { type: boolean }
            version: { type: integer, minimum: 1, nullable: true }
        message: { type: string }
    StudentDeviceBinding:
      type: object
      required: [id, matricula, attendanceUuid, bindingVersion, active, updatedAt]
      properties:
        id: { type: string, format: uuid }
        matricula: { type: string }
        attendanceUuid: { type: string, format: uuid }
        deviceBindingId: { type: string, format: uuid, nullable: true }
        platform: { type: string, nullable: true }
        deviceInfo: { type: string, nullable: true }
        bindingVersion: { type: integer, minimum: 1 }
        active: { type: boolean }
        updatedAt: { type: string, format: date-time }
    SafeLogin:
      type: object
      properties:
        exito:
          type: boolean
        cambiaPass:
          type: boolean
        mensaje:
          type: string
        parametros:
          type: object
          additionalProperties: true
    UatDataResponse:
      type: object
      required: [source, endpoint, query, data, fetchedAt]
      properties:
        source:
          type: string
          example: UAT
        endpoint:
          type: string
          example: BuscaHorarios
        query:
          type: object
          additionalProperties: true
        data:
          description: JSON crudo recibido del portal UAT.
        fetchedAt:
          type: string
          format: date-time
    UatObjectResponse:
      type: object
      required: [source, endpoint, query, data, fetchedAt]
      properties:
        source:
          type: string
          example: UAT
        endpoint:
          type: string
          example: BuscaAsistenciaGrupo
        query:
          type: object
          additionalProperties: true
        data:
          type: object
          additionalProperties: true
        fetchedAt:
          type: string
          format: date-time
    AsistenciaAlumnoInput:
      type: object
      required: [id_alumno, num_pase_lista, num_dia, sn_asistencia]
      properties:
        id_alumno:
          type: integer
          minimum: 1
          example: 371591
        num_pase_lista:
          type: integer
          minimum: 0
          example: 1
        num_dia:
          type: integer
          minimum: 1
          maximum: 7
          example: 1
        sn_asistencia:
          type: boolean
          example: true
    RegistrarAsistenciasRequest:
      type: object
      required: [ClientRecordId, Id_Grupo, Fec_Ini, Asistencia]
      properties:
        ClientRecordId:
          type: string
          minLength: 1
          maxLength: 160
          description: Identificador estable del registro local usado para reconciliar el resultado asíncrono.
        Id_Grupo:
          type: integer
          minimum: 1
          example: 947699
        Fec_Ini:
          type: string
          pattern: "^\\d{2}/\\d{2}/\\d{4}$"
          example: 19/01/2026
        Asistencia:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AsistenciaAlumnoInput"
    GuardaAsistenciasResponse:
      type: object
      required: [exito, mensaje]
      additionalProperties: true
      properties:
        exito:
          type: boolean
          example: true
        mensaje:
          type: string
    AttendanceCaptureResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [attendanceSessionId, externalGroupId, date, entriesCount, uploadStatus, duplicate, version]
          properties:
            attendanceSessionId: { type: string }
            externalGroupId: { type: string }
            date: { type: string, format: date }
            entriesCount: { type: integer, minimum: 1 }
            uploadStatus:
              type: string
              enum: [PENDING, SKIPPED]
            duplicate: { type: boolean }
            version: { type: integer, minimum: 1 }
    SnapshotRequest:
      allOf:
        - $ref: "#/components/schemas/Credentials"
        - type: object
          required: [Id_Ciclo_Escolar, Id_DES]
          properties:
            Id_Ciclo_Escolar:
              type: integer
              minimum: 1
              example: 150
            Id_DES:
              type: integer
              minimum: 1
              example: 12
            includeExamenes:
              type: boolean
              default: true
    SnapshotResponse:
      type: object
      required: [source, authenticated, login, query, horarios, fetchedAt]
      properties:
        source:
          type: string
          example: UAT
        authenticated:
          type: boolean
        login:
          $ref: "#/components/schemas/SafeLogin"
        query:
          type: object
          additionalProperties: true
        horarios:
          description: JSON crudo recibido de BuscaHorarios.
        examenes:
          description: JSON crudo recibido de BuscaExamenes cuando includeExamenes=true.
        fetchedAt:
          type: string
          format: date-time
    CoordinationSummary:
      type: object
      required: [id, externalId, name, shortName, teacherCount, subjectCount, assignmentCount]
      properties:
        id: { type: string }
        externalId: { type: string }
        name: { type: string }
        shortName: { type: string, nullable: true }
        teacherCount: { type: integer }
        subjectCount: { type: integer }
        assignmentCount: { type: integer }
    TeacherSummary:
      type: object
      required: [id, externalId, institutionalCode, name, email, lastAuthenticatedAt, lastHarvestedAt, assignmentCount, subjectCount, coordinations]
      properties:
        id: { type: string }
        externalId: { type: string }
        institutionalCode: { type: string, nullable: true }
        name: { type: string }
        email: { type: string, nullable: true }
        lastAuthenticatedAt: { type: string, format: date-time }
        lastHarvestedAt: { type: string, format: date-time, nullable: true }
        assignmentCount: { type: integer }
        subjectCount: { type: integer }
        coordinations:
          type: array
          items:
            type: object
            required: [id, externalId, name]
            properties:
              id: { type: string }
              externalId: { type: string }
              name: { type: string }
    GroupAssignment:
      type: object
      required: [id, externalGroupId, groupCode, schoolCycleExternalId, schoolCycleName, firstSeenAt, lastSeenAt, teacher, subject, coordination]
      properties:
        id: { type: string }
        externalGroupId: { type: string }
        groupCode: { type: string, nullable: true }
        schoolCycleExternalId: { type: string }
        schoolCycleName: { type: string, nullable: true }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        teacher:
          type: object
          additionalProperties: true
        subject:
          type: object
          additionalProperties: true
        coordination:
          type: object
          additionalProperties: true
    SharedClassInput:
      type: object
      required: [sourceAssignmentId, assignedTeacherId, schoolCycleYear, schoolCycleTerm]
      properties:
        sourceAssignmentId: { type: string }
        assignedTeacherId: { type: string }
        schoolCycleYear: { type: integer, minimum: 2000, maximum: 2100, example: 2026 }
        schoolCycleTerm: { type: integer, minimum: 1, maximum: 3, example: 1 }
        active: { type: boolean, default: true }
        notes: { type: string, nullable: true, maxLength: 500 }
    SharedClassAssignment:
      allOf:
        - $ref: "#/components/schemas/SharedClassInput"
        - type: object
          required: [id, active, createdAt, updatedAt, sourceAssignment, assignedTeacher]
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            sourceAssignment: { $ref: "#/components/schemas/GroupAssignment" }
            assignedTeacher:
              type: object
              additionalProperties: true
    SharedClassUpdate:
      type: object
      properties:
        sourceAssignmentId: { type: string }
        assignedTeacherId: { type: string }
        schoolCycleYear: { type: integer, minimum: 2000, maximum: 2100 }
        schoolCycleTerm: { type: integer, minimum: 1, maximum: 3 }
        active: { type: boolean }
        notes: { type: string, nullable: true, maxLength: 500 }
    ProfessorSharedClass:
      type: object
      required: [id, code, groupLetter, period, group, name, classroom, schedule, students, studentsCount, source, isShared, sharedAssignmentId]
      properties:
        id: { type: string, description: Id_Grupo de Administracion Escolar }
        code: { type: string }
        groupLetter: { type: string }
        period: { type: string }
        group: { type: string }
        name: { type: string }
        level: { type: string, nullable: true }
        classroom: { type: string }
        schedule: { type: object, additionalProperties: true }
        students: { type: array, items: { type: object } }
        studentsCount: { type: integer }
        source: { type: string, enum: [SHARED] }
        isShared: { type: boolean, enum: [true] }
        sharedAssignmentId: { type: string }
        sharedCycle:
          type: object
          required: [year, term]
          properties:
            year: { type: integer }
            term: { type: integer }
        primaryProfessor: { type: object, additionalProperties: true }
    ProfessorSharedClassesResponse:
      type: object
      required: [source, data, fetchedAt]
      properties:
        source: { type: string, enum: [SHARED_CLASSES] }
        data:
          type: array
          items: { $ref: "#/components/schemas/ProfessorSharedClass" }
        fetchedAt: { type: string, format: date-time }
    CoordinationOverviewResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [counts, coordinations]
          properties:
            counts:
              type: object
              required: [teachers, subjects, coordinations, assignments]
              properties:
                teachers: { type: integer }
                subjects: { type: integer }
                coordinations: { type: integer }
                assignments: { type: integer }
            coordinations:
              type: array
              items: { $ref: "#/components/schemas/CoordinationSummary" }
        meta: { $ref: "#/components/schemas/GeneratedMeta" }
    CoordinationListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CoordinationSummary" }
        meta: { $ref: "#/components/schemas/GeneratedMeta" }
    InfrastructureSummaryResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [counts, recentBindings, recentSubstitutions, recentBeacons]
          properties:
            counts:
              type: object
              required: [beacons, studentDeviceBindings, studentBleAttendances, activeSubstitutions]
              properties:
                beacons: { type: integer }
                studentDeviceBindings: { type: integer }
                studentBleAttendances: { type: integer }
                activeSubstitutions: { type: integer }
            recentBindings:
              type: array
              items:
                type: object
                additionalProperties: true
            recentSubstitutions:
              type: array
              items:
                type: object
                additionalProperties: true
            recentBeacons:
              type: array
              items:
                type: object
                additionalProperties: true
        meta: { $ref: "#/components/schemas/GeneratedMeta" }
    TeacherListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/TeacherSummary" }
        meta:
          type: object
          required: [page, pageSize, total, totalPages]
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }
    TeacherAssignmentsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [teacher, assignments]
          properties:
            teacher: { $ref: "#/components/schemas/TeacherSummary" }
            assignments:
              type: array
              items: { $ref: "#/components/schemas/GroupAssignment" }
        meta: { $ref: "#/components/schemas/GeneratedMeta" }
    GeneratedMeta:
      type: object
      required: [generatedAt]
      properties:
        generatedAt: { type: string, format: date-time }
    WeeklyAttendanceReport:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [availability, teacher, week, summary, rows]
          properties:
            availability: { type: string, enum: [READY, NOT_SYNCED, IDENTITY_UNAVAILABLE, ATTENDANCE_SOURCE_UNAVAILABLE] }
            teacher: { type: object, additionalProperties: true }
            week: { type: object, additionalProperties: true }
            summary: { type: object, additionalProperties: true }
            rows:
              type: array
              items:
                type: object
                additionalProperties: true
        meta:
          type: object
          required: [generatedAt, timezone]
          properties:
            generatedAt: { type: string, format: date-time }
            timezone: { type: string, example: America/Mexico_City }
    RangeAttendanceReport:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [mode, availability, teacher, range, summary, rows]
          properties:
            mode: { type: string, enum: [range] }
            availability: { type: string, enum: [READY, NOT_SYNCED, IDENTITY_UNAVAILABLE, ATTENDANCE_SOURCE_UNAVAILABLE] }
            teacher: { type: object, additionalProperties: true }
            range:
              type: object
              required: [start, end]
              properties:
                start: { type: string, format: date }
                end: { type: string, format: date }
            summary:
              type: object
              required: [scheduledClassDays, reportedClassDays, missingClassDays, attendanceRate]
              properties:
                scheduledClassDays: { type: integer }
                reportedClassDays: { type: integer }
                missingClassDays: { type: integer }
                attendanceRate: { type: number, format: float }
            rows:
              type: array
              items:
                type: object
                required: [id, groupId, groupCode, grade, subject, scheduledClassDays, reportedClassDays, attendanceRate]
                properties:
                  id: { type: string }
                  groupId: { type: string }
                  groupCode: { type: string }
                  grade: { type: string, nullable: true }
                  subject: { type: string }
                  classroom: { type: string, nullable: true }
                  educationLevel: { type: string, nullable: true }
                  period: { type: string }
                  scheduledClassDays: { type: integer }
                  reportedClassDays: { type: integer }
                  attendanceRate: { type: number, format: float, nullable: true }
        meta:
          type: object
          required: [generatedAt, timezone]
          properties:
            generatedAt: { type: string, format: date-time }
            timezone: { type: string, example: America/Mexico_City }
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: UAT_LOGIN_FAILED
        message:
          type: string
        details:
          nullable: true
