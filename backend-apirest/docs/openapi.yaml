openapi: 3.0.3
info:
  title: Presencia Backend API REST UAT
  version: 0.1.0
  description: >
    API REST interna para autenticar contra el portal escolar UAT con cookies
    ASP.NET y consultar horarios/examenes de profesor.
servers:
  - url: http://localhost:3100
security: []
paths:
  /health:
    get:
      summary: Estado del servicio
      responses:
        "200":
          description: Servicio disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/uat/sessions:
    post:
      summary: Crea una sesion autenticada contra UAT
      description: >
        Ejecuta GET /Login, POST /Login/Accesar_Dominio y GET /Login/Validar
        manteniendo un CookieJar persistente en memoria.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Sesion UAT creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/sessions/{sessionId}:
    delete:
      summary: Elimina una sesion UAT en memoria
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "200":
          description: Resultado de eliminacion
          content:
            application/json:
              schema:
                type: object
                required: [deleted, sessionId]
                properties:
                  deleted:
                    type: boolean
                  sessionId:
                    type: string
                    format: uuid
  /api/uat/profesor/consultas/horarios:
    get:
      summary: Consulta horarios del profesor autenticado
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - $ref: "#/components/parameters/IdCicloEscolar"
        - $ref: "#/components/parameters/IdDes"
      responses:
        "200":
          description: JSON devuelto por BuscaHorarios, envuelto con metadatos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/profesor/consultas/examenes:
    get:
      summary: Consulta examenes del profesor autenticado
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - $ref: "#/components/parameters/IdCicloEscolar"
        - $ref: "#/components/parameters/IdDes"
      responses:
        "200":
          description: JSON devuelto por BuscaExamenes, envuelto con metadatos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/profesor/consultas/snapshot:
    post:
      summary: Login transitorio y consulta de horarios/examenes
      description: >
        Ejecuta todo el flujo en una sola peticion usando un CookieJar temporal.
        No guarda la sesion en memoria.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotRequest"
      responses:
        "200":
          description: Horarios y opcionalmente examenes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/catalogos/niveles-educativos:
    get:
      summary: Catalogo de niveles educativos para profesor
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      responses:
        "200":
          description: JSON devuelto por BuscarNivelEducativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
  /api/uat/catalogos/campus:
    get:
      summary: Catalogo de campus
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - name: id_nivel_educativo
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: JSON devuelto por BuscarCampus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
  /api/uat/catalogos/des:
    get:
      summary: Catalogo de DES
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - name: id_nivel_educativo
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: id_cu
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: JSON devuelto por BuscarDES
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
  /api/uat/catalogos/ciclos-escolares:
    get:
      summary: Catalogo de ciclos escolares
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      responses:
        "200":
          description: JSON devuelto por BuscarCicloEscolar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
  /api/uat/profesor/control-asistencia/grupos:
    get:
      summary: Consulta grupos del profesor para un ciclo y DES
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - $ref: "#/components/parameters/IdDesControl"
        - $ref: "#/components/parameters/IdCiclo"
        - $ref: "#/components/parameters/IdPlantilla"
      responses:
        "200":
          description: JSON devuelto por BuscaGruposProfesor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/profesor/control-asistencia/semanas:
    get:
      summary: Consulta semanas disponibles para un grupo
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - $ref: "#/components/parameters/IdGrupo"
      responses:
        "200":
          description: JSON devuelto por BuscaSemanas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatDataResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/profesor/control-asistencia/asistencia-grupo:
    get:
      summary: Consulta alumnos y asistencia capturada para una semana de grupo
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
        - $ref: "#/components/parameters/IdGrupo"
        - name: fec_ini
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\d{2}/\\d{2}/\\d{4}$"
          example: 19/01/2026
        - name: fec_fin
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\d{2}/\\d{2}/\\d{4}$"
          example: 25/01/2026
      responses:
        "200":
          description: JSON devuelto por BuscaAsistenciaGrupo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UatObjectResponse"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/profesor/control-asistencia/asistencias:
    post:
      summary: Guarda asistencias en el portal UAT
      description: >
        Recibe un arreglo tipado de asistencias, lo serializa como JSON
        comprimido y lo envia al endpoint UAT GuardaAsistencias como
        application/x-www-form-urlencoded.
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarAsistenciasRequest"
      responses:
        "200":
          description: Respuesta cruda del portal UAT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardaAsistenciasResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/uat/asistencia/guardar:
    post:
      summary: Alias corto para guardar asistencias
      parameters:
        - $ref: "#/components/parameters/UatSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarAsistenciasRequest"
      responses:
        "200":
          description: Respuesta cruda del portal UAT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardaAsistenciasResponse"
  /api/coordinacion/resumen:
    get:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Resumen del grafo academico recolectado
      responses:
        "200":
          description: Conteos y coordinaciones acumulados localmente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoordinationOverviewResponse"
  /api/coordinacion/coordinaciones:
    get:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Lista coordinaciones academicas
      responses:
        "200":
          description: Coordinaciones con conteos de relaciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoordinationListResponse"
  /api/coordinacion/profesores:
    get:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Lista profesores recolectados
      parameters:
        - name: coordinationId
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Pagina de profesores normalizados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherListResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/coordinacion/profesores/{teacherId}/asignaciones:
    get:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Detalle y asignaciones de un profesor
      parameters:
        - name: teacherId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Profesor con materias, grupos, ciclos y coordinaciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherAssignmentsResponse"
        "404":
          $ref: "#/components/responses/Error"
  /api/coordinacion/auth/login:
    post:
      tags: [Coordinacion]
      summary: Inicia una sesión administrativa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
      responses:
        "200":
          description: Sesión creada; emite cookie HttpOnly coord_session
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/coordinacion/auth/me:
    get:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Obtiene el coordinador autenticado
      responses:
        "200": { description: Perfil de coordinación }
        "401": { $ref: "#/components/responses/Error" }
  /api/coordinacion/auth/logout:
    post:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Revoca la sesión administrativa
      responses:
        "204": { description: Sesión revocada }
  /api/coordinacion/reportes/asistencia-semanal:
    get:
      tags: [Coordinacion]
      security: [{ CoordinatorCookie: [] }]
      summary: Reporte de cumplimiento docente de lunes a jueves
      parameters:
        - name: teacherId
          in: query
          required: true
          schema: { type: string }
        - name: weekStart
          in: query
          required: true
          description: Fecha del lunes en formato YYYY-MM-DD
          schema: { type: string, format: date }
      responses:
        "200":
          description: Matriz semanal de lunes a sabado con estados TAKEN, MISSING, FUTURE, NOT_SCHEDULED o UNKNOWN_SCHEDULE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeeklyAttendanceReport" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    CoordinatorCookie:
      type: apiKey
      in: cookie
      name: coord_session
  parameters:
    UatSessionHeader:
      name: X-UAT-Session-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdCicloEscolar:
      name: Id_Ciclo_Escolar
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      example: 150
    IdDes:
      name: Id_DES
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      example: 12
    IdDesControl:
      name: Id_Des
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      example: 12
    IdCiclo:
      name: Id_Ciclo
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      example: 150
    IdPlantilla:
      name: Id_Plantilla
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      example: 308127
    IdGrupo:
      name: Id_Grupo
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      example: 947699
  responses:
    Error:
      description: Error de validacion, autenticacion o portal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: profesor@uat.edu.mx
        password:
          type: string
          format: password
    HealthResponse:
      type: object
      required: [status, service, activeUatSessions, timestamp]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: backend-apirest
        activeUatSessions:
          type: integer
        timestamp:
          type: string
          format: date-time
    SessionResponse:
      type: object
      required: [sessionId, authenticated, login, createdAt, lastUsedAt, expiresAt]
      properties:
        sessionId:
          type: string
          format: uuid
        authenticated:
          type: boolean
        login:
          $ref: "#/components/schemas/SafeLogin"
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        activeSessions:
          type: integer
        cookieDiagnostics:
          type: object
          properties:
            cookieNames:
              type: array
              items:
                type: string
            hasSessionCookie:
              type: boolean
            hasAuthCookie:
              type: boolean
    SafeLogin:
      type: object
      properties:
        exito:
          type: boolean
        cambiaPass:
          type: boolean
        mensaje:
          type: string
        parametros:
          type: object
          additionalProperties: true
    UatDataResponse:
      type: object
      required: [source, endpoint, query, data, fetchedAt]
      properties:
        source:
          type: string
          example: UAT
        endpoint:
          type: string
          example: BuscaHorarios
        query:
          type: object
          additionalProperties: true
        data:
          description: JSON crudo recibido del portal UAT.
        fetchedAt:
          type: string
          format: date-time
    UatObjectResponse:
      type: object
      required: [source, endpoint, query, data, fetchedAt]
      properties:
        source:
          type: string
          example: UAT
        endpoint:
          type: string
          example: BuscaAsistenciaGrupo
        query:
          type: object
          additionalProperties: true
        data:
          type: object
          additionalProperties: true
        fetchedAt:
          type: string
          format: date-time
    AsistenciaAlumnoInput:
      type: object
      required: [id_alumno, num_pase_lista, num_dia, sn_asistencia]
      properties:
        id_alumno:
          type: integer
          minimum: 1
          example: 371591
        num_pase_lista:
          type: integer
          minimum: 0
          example: 1
        num_dia:
          type: integer
          minimum: 1
          maximum: 7
          example: 1
        sn_asistencia:
          type: boolean
          example: true
    RegistrarAsistenciasRequest:
      type: object
      required: [Id_Grupo, Fec_Ini, Asistencia]
      properties:
        Id_Grupo:
          type: integer
          minimum: 1
          example: 947699
        Fec_Ini:
          type: string
          pattern: "^\\d{2}/\\d{2}/\\d{4}$"
          example: 19/01/2026
        Asistencia:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AsistenciaAlumnoInput"
    GuardaAsistenciasResponse:
      type: object
      required: [exito, mensaje]
      additionalProperties: true
      properties:
        exito:
          type: boolean
          example: true
        mensaje:
          type: string
    SnapshotRequest:
      allOf:
        - $ref: "#/components/schemas/Credentials"
        - type: object
          required: [Id_Ciclo_Escolar, Id_DES]
          properties:
            Id_Ciclo_Escolar:
              type: integer
              minimum: 1
              example: 150
            Id_DES:
              type: integer
              minimum: 1
              example: 12
            includeExamenes:
              type: boolean
              default: true
    SnapshotResponse:
      type: object
      required: [source, authenticated, login, query, horarios, fetchedAt]
      properties:
        source:
          type: string
          example: UAT
        authenticated:
          type: boolean
        login:
          $ref: "#/components/schemas/SafeLogin"
        query:
          type: object
          additionalProperties: true
        horarios:
          description: JSON crudo recibido de BuscaHorarios.
        examenes:
          description: JSON crudo recibido de BuscaExamenes cuando includeExamenes=true.
        fetchedAt:
          type: string
          format: date-time
    CoordinationSummary:
      type: object
      required: [id, externalId, name, shortName, teacherCount, subjectCount, assignmentCount]
      properties:
        id: { type: string }
        externalId: { type: string }
        name: { type: string }
        shortName: { type: string, nullable: true }
        teacherCount: { type: integer }
        subjectCount: { type: integer }
        assignmentCount: { type: integer }
    TeacherSummary:
      type: object
      required: [id, externalId, institutionalCode, name, email, lastAuthenticatedAt, lastHarvestedAt, assignmentCount, subjectCount, coordinations]
      properties:
        id: { type: string }
        externalId: { type: string }
        institutionalCode: { type: string, nullable: true }
        name: { type: string }
        email: { type: string, nullable: true }
        lastAuthenticatedAt: { type: string, format: date-time }
        lastHarvestedAt: { type: string, format: date-time, nullable: true }
        assignmentCount: { type: integer }
        subjectCount: { type: integer }
        coordinations:
          type: array
          items:
            type: object
            required: [id, externalId, name]
            properties:
              id: { type: string }
              externalId: { type: string }
              name: { type: string }
    GroupAssignment:
      type: object
      required: [id, externalGroupId, groupCode, schoolCycleExternalId, schoolCycleName, firstSeenAt, lastSeenAt, teacher, subject, coordination]
      properties:
        id: { type: string }
        externalGroupId: { type: string }
        groupCode: { type: string, nullable: true }
        schoolCycleExternalId: { type: string }
        schoolCycleName: { type: string, nullable: true }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        teacher:
          type: object
          additionalProperties: true
        subject:
          type: object
          additionalProperties: true
        coordination:
          type: object
          additionalProperties: true
    CoordinationOverviewResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [counts, coordinations]
          properties:
            counts:
              type: object
              required: [teachers, subjects, coordinations, assignments]
              properties:
                teachers: { type: integer }
                subjects: { type: integer }
                coordinations: { type: integer }
                assignments: { type: integer }
            coordinations:
              type: array
              items: { $ref: "#/components/schemas/CoordinationSummary" }
        meta: { $ref: "#/components/schemas/GeneratedMeta" }
    CoordinationListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CoordinationSummary" }
        meta: { $ref: "#/components/schemas/GeneratedMeta" }
    TeacherListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/TeacherSummary" }
        meta:
          type: object
          required: [page, pageSize, total, totalPages]
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }
    TeacherAssignmentsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [teacher, assignments]
          properties:
            teacher: { $ref: "#/components/schemas/TeacherSummary" }
            assignments:
              type: array
              items: { $ref: "#/components/schemas/GroupAssignment" }
        meta: { $ref: "#/components/schemas/GeneratedMeta" }
    GeneratedMeta:
      type: object
      required: [generatedAt]
      properties:
        generatedAt: { type: string, format: date-time }
    WeeklyAttendanceReport:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [availability, teacher, week, summary, rows]
          properties:
            availability: { type: string, enum: [READY, NOT_SYNCED, IDENTITY_UNAVAILABLE] }
            teacher: { type: object, additionalProperties: true }
            week: { type: object, additionalProperties: true }
            summary: { type: object, additionalProperties: true }
            rows:
              type: array
              items:
                type: object
                additionalProperties: true
        meta:
          type: object
          required: [generatedAt, timezone]
          properties:
            generatedAt: { type: string, format: date-time }
            timezone: { type: string, example: America/Mexico_City }
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: UAT_LOGIN_FAILED
        message:
          type: string
        details:
          nullable: true
