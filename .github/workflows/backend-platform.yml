name: Backend platform

on:
  pull_request:
  push:
    branches: [main, jared-dev]

permissions:
  contents: read

concurrency:
  group: backend-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify student app contracts
        working-directory: app-alumno
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Verify professor app contracts
        working-directory: app-profesor
        run: |
          flutter pub get
          flutter analyze
          flutter test

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.7.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            backend-apirest/package-lock.json
            frontend-coord/package-lock.json

      - name: Install platform dependencies
        run: npm ci
      - name: Verify services and contracts
        run: npm run verify

      - name: Install and verify compatibility backend
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Install and verify UAT integration
        working-directory: backend-apirest
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Install and verify coordination web
        working-directory: frontend-coord
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Validate infrastructure files
        run: |
          sh -n infra/postgres/init-databases.sh
          docker compose --env-file infra/compose/.env.dokploy.example --file infra/compose/docker-compose.microservices.yml config --quiet

      - name: Audit backend production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high --prefix backend
          npm audit --omit=dev --audit-level=high --prefix backend-apirest

  compose-integration:
    needs: [mobile-contracts, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.7.0

      - name: Generate isolated integration environment
        run: |
          node infra/scripts/create-ci-env.mjs /tmp/presencia-ci.env
          node infra/scripts/validate-dokploy-env.mjs /tmp/presencia-ci.env

      - name: Create Dokploy-compatible ingress network
        run: docker network create dokploy-network

      - name: Build and start the complete platform
        run: >-
          docker compose --project-name presencia-ci
          --env-file /tmp/presencia-ci.env
          --file infra/compose/docker-compose.microservices.yml
          --file infra/compose/docker-compose.ci.yml
          up --build --detach --wait --wait-timeout 300

      - name: Run public deployment smoke checks
        env:
          PRESENCIA_BASE_URL: http://127.0.0.1:18080
        run: node infra/scripts/smoke-deployment.mjs

      - name: Verify the cross-service academic and attendance flow
        run: >-
          docker run --rm
          --network presencia-ci_private
          --env-file /tmp/presencia-ci.env
          --volume "$PWD/infra/scripts:/scripts:ro"
          node:24.7-alpine
          node /scripts/verify-service-flow.mjs

      - name: Show container diagnostics on failure
        if: failure()
        run: >-
          docker compose --project-name presencia-ci
          --env-file /tmp/presencia-ci.env
          --file infra/compose/docker-compose.microservices.yml
          --file infra/compose/docker-compose.ci.yml
          logs --no-color --tail 250

      - name: Remove integration stack
        if: always()
        run: |
          docker compose --project-name presencia-ci --env-file /tmp/presencia-ci.env --file infra/compose/docker-compose.microservices.yml --file infra/compose/docker-compose.ci.yml down --volumes --remove-orphans
          docker network rm dokploy-network || true
