services:
  uat-portal-mock:
    image: node:24-alpine
    init: true
    user: node
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["node", "/scripts/uat-portal-mock.mjs"]
    volumes:
      - ../scripts/uat-portal-mock.mjs:/scripts/uat-portal-mock.mjs:ro
    expose: ["3900"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3900/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s
    networks: [private]

  uat-integration:
    environment:
      UAT_BASE_URL: http://uat-portal-mock:3900
      UAT_ALUMNOS_BASE_URL: http://uat-portal-mock:3900
      UAT_HTTP_TIMEOUT_MS: 5000
    depends_on:
      uat-portal-mock:
        condition: service_healthy

  frontend-coord:
    ports:
      - "127.0.0.1:18080:8080"
